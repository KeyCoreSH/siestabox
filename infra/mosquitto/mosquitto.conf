# Mosquitto — broker MQTT da Siesta Box Platform
# O backend conecta sem autenticação na rede interna do compose.
# Em produção fora do compose, habilite `allow_anonymous false` + password_file.

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Mensagens retidas (status das unidades) não têm expiração forçada:
# o LWT do firmware marca a unidade offline quando o módulo cai.

max_keepalive 60
